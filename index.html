<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QuickNotes</title>

  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>

<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>Load, create, and manage your notes.</p>
    </header>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your Notes</h2>

      <button type="button" id="load-btn">
        Load notes from server
      </button>

      <p id="status" role="status" aria-live="polite"></p>

      <ul id="notes-list"></ul>
    </section>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a Note</h2>

      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Note title</label>
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="body-input">Note body (optional)</label>
          <textarea
            id="body-input"
            name="body"
            rows="4"
          ></textarea>
        </div>

        <button type="submit" id="submit-btn">
          Create note
        </button>
      </form>
    </section>
  </main>
</body>
</html>
